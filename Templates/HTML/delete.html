<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>
    <link rel="stylesheet" href="../CSS/delete.css">
</head>
<body>
<div>
    <div class="delete-cont">
        <fieldset>
            <legend>Are you sure to delete this account</legend>
            <label for="yes">Yes</label>
            <input type="radio" id="yes" name="notify" value="yes">
            <label for="no">No</label>
            <input type="radio" id="no" name="notify" value="no">
        </fieldset>
    </div>
    <label for="password">Password</label>
    <input type="password" id="password" name="email" placeholder="Add your password" required>
    <button class="delete">Delete</button>
</div>

</body>
</html>
