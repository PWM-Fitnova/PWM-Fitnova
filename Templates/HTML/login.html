<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="../JS/Loader.js"></script>
    <link rel="stylesheet" href="../CSS/styleReset.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <header id="header"></header>
        <main class="login-container">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Add your email" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Add your password" required>
                <button class="login">Login</button>
                <a href="register.html" class="create_account">Create an account</a>
            </div>
        </main>
    <footer id="footer"></footer>

</body>
</html>
